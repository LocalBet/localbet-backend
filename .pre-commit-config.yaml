# .pre-commit-config.yaml - curated hooks for Keepup

fail_fast: true

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        name: "📦 Large Files Checker"
        args: [--maxkb=100]
        stages: [pre-commit]

      - id: check-case-conflict
        name: "🔠 Case Conflict Checker"
        stages: [pre-commit]

      - id: check-json
        name: "📄 JSON Files Checker"
        files: '.*\.json'
        stages: [pre-commit]

      - id: check-toml
        name: "📄 TOML Files Checker"
        files: '.*\.toml'
        stages: [pre-commit]

      - id: check-yaml
        name: "📄 YAML Files Checker"
        files: '.*\.ya?ml'
        args: [--unsafe]
        stages: [pre-commit]

      - id: name-tests-test
        name: "🧪 Test Files Checker"
        files: '.*test.*\.py'
        exclude: '^tests/.*/mothers/.*\.py$|^tests/.*/actions/.*\.py$'
        args: [--pytest-test-first]
        stages: [pre-commit]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        name: "🪓 ruff (lint + fix)"
        args: [--fix, --line-length=120]
        stages: [pre-commit]

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: "🖌️ black"
        language_version: python3
        args: ["--line-length=120"]
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: "📚 isort"
        args: ["--profile=black", "--line-length=120"]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        name: "🔎 mypy"
        additional_dependencies: [mypy==1.5.1]
        stages: [pre-push]
        files: '^(src|tests)/'  # limit to relevant sources

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.1
    hooks:
      - id: bandit
        name: "🔐 bandit"
        args: ['-r', 'src']
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.1
    hooks:
      - id: gitleaks
        name: "🔍 gitleaks (secrets)"
        stages: [pre-push]